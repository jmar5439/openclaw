name: build-fork

on:
  push:
    branches:
      - ci/build-fork
      - fix/telegram-final-vanish
      - fix/acp-bound-dispatch-gates
      - fix/sessions-acp-agent-resolution
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: NODE_OPTIONS=--max-old-space-size=8192 pnpm build
      - id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          suffixed="${base}-jordi.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$suffixed"
          echo "package-version=$suffixed" >> "$GITHUB_OUTPUT"
      - id: pack
        run: |
          tgz="$(pnpm pack --pack-destination ./dist-pack 2>/dev/null | tail -1)"
          echo "tarball=$tgz" >> "$GITHUB_OUTPUT"
          ls -la ./dist-pack/
      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-tgz
          path: dist-pack/*.tgz
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openclaw-tgz
          path: ./deploy-pkg
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts
          scp ./deploy-pkg/*.tgz "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/openclaw-fork.tgz"
          ssh "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" "
            set -e
            export PATH=\"\$HOME/.npm-global/bin:\$PATH\"
            npm i -g /tmp/openclaw-fork.tgz
            openclaw gateway restart
            sleep 45
            ver=\"\$(openclaw --version | head -1)\"
            echo \"installed: \$ver\"
            echo \"\$ver\" | grep -q '${{ needs.build.outputs.package-version }}' || (echo \"version mismatch\"; exit 1)
            test -d ~/.openclaw/extensions && ls ~/.openclaw/extensions | head -5
            systemctl --user is-active openclaw-gateway.service
          "
