name: build-fork

on:
  push:
    branches:
      - ci/build-fork
      - fix/telegram-final-vanish
      - fix/acp-bound-dispatch-gates
      - fix/sessions-acp-agent-resolution
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (leave default to build this branch)"
        required: false
        default: ci/build-fork
        type: string
      deploy:
        description: "Deploy to the VPS gateway after build (PROD — ask first)"
        required: false
        default: false
        type: boolean
      inspect:
        description: "Inspect VPS disk, package, and gateway status"
        required: false
        default: false
        type: boolean

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.inspect != true
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: corepack enable && corepack prepare --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          suffixed="${base}-${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$suffixed"
          echo "package-version=$suffixed" >> "$GITHUB_OUTPUT"
      - id: pack
        run: |
          mkdir -p ./dist-pack
          node --import ./scripts/tsx.mjs scripts/package-openclaw-for-docker.mts --allow-unreleased-changelog --output-dir "${PWD}/dist-pack"
          tgz="$(ls -1 ./dist-pack/*.tgz | head -1)"
          test -n "$tgz" && test -f "$tgz"
          echo "tarball=$tgz" >> "$GITHUB_OUTPUT"
          ls -la ./dist-pack/
      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-tgz
          path: dist-pack/*.tgz
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openclaw-tgz
          path: ./deploy-pkg
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts
          scp ./deploy-pkg/*.tgz "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/openclaw-fork.tgz"
          ssh "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" "bash -s -- '${{ needs.build.outputs.package-version }}'" <<'REMOTE'
          set -e
          expected_version="$1"
          export PATH="$HOME/.npm-global/bin:$PATH"
          avail_kb="$(df -k /tmp | tail -1 | awk '{print $4}')"
          if [ "$avail_kb" -lt 2097152 ]; then npm cache clean --force; fi
          avail_kb="$(df -k /tmp | tail -1 | awk '{print $4}')"
          test "$avail_kb" -ge 1048576 || { echo "disk full, refusing install"; exit 1; }
          npm i -g /tmp/openclaw-fork.tgz
          openclaw gateway stop --force
          sleep 10
          openclaw gateway start
          sleep 60
          ver="$(openclaw --version | head -1)"
          echo "installed: $ver"
          echo "$ver" | grep -Fq "$expected_version" || { echo "version mismatch"; exit 1; }
          test -d ~/.openclaw/extensions && ls ~/.openclaw/extensions | head -5
          systemctl --user is-active openclaw-gateway.service
          REMOTE

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect == true
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" 'bash -s' <<'REMOTE'
          set +e
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo '--- filesystem ---'
          df -h / /tmp
          echo '--- package in /tmp ---'
          ls -lh /tmp/openclaw-fork.tgz
          echo '--- installed version ---'
          openclaw --version
          echo '--- service ---'
          systemctl --user --no-pager status openclaw-gateway.service
          echo '--- gateway status ---'
          openclaw gateway status --deep
          REMOTE
